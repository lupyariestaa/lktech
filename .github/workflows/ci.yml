name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan job lama untuk ref yang sama (hemat runner).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (semua scripts/*.test.ts)
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          # Build tidak boleh butuh kredensial asli — env dummy agar fail-safe
          # (fitur gateway/DB nonaktif bila kosong, build tetap sukses).
          NEXT_TELEMETRY_DISABLED: "1"

      - name: E2E (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
